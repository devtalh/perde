plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Opt-in compatibility profiles. Loom 26.x localRuntime is not published or bundled.
def compatProfile = providers.gradleProperty('perde.compat').getOrElse('')
if (!(compatProfile in ['', 'sodium', 'iris', 'full'])) {
    throw new GradleException('perde.compat must be sodium, iris or full (omit for vanilla).')
}

loom {
    splitEnvironmentSourceSets()

    mods {
        perde {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        server {
            runDir = 'run/server'
        }
        client {
            programArgs '--username', 'Player1'
        }
        client2 {
            client()
            runDir = 'run/client2'
            programArgs '--username', 'Player2'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModrinthCompat'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'MCEFModern'
        url = 'https://maven.dimaskama.net/releases'
        content {
            includeGroup 'net.dimaskama'
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "me.friwi:jcef-api:${project.jcef_api_version}"
    testImplementation sourceSets.client.output
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    clientImplementation "net.dimaskama:mcef-modern:${project.mcef_version}"
    // MCEF publishes JCEF as a runtime dependency; the browser backend also calls its native API.
    clientCompileOnly "me.friwi:jcef-api:${project.jcef_api_version}"

    // Immutable Modrinth version IDs select the exact MC 26.2 Fabric jars.
    if (compatProfile) {
        localRuntime 'maven.modrinth:sodium:xJZxADzI' // 0.9.2
        localRuntime 'maven.modrinth:sodium-extra:kGXOsmfx' // 0.9.4
        localRuntime 'maven.modrinth:reeses-sodium-options:nnz8j4Hu' // 2.2.4
    }
    if (compatProfile in ['iris', 'full']) {
        localRuntime 'maven.modrinth:iris:gxZWWnKH' // 1.11.4
    }
    if (compatProfile == 'full') {
        localRuntime 'maven.modrinth:entityculling:RWjup6Jf' // 1.11.2
        localRuntime 'maven.modrinth:moreculling:D5oVCouK' // 1.8.1
        localRuntime 'maven.modrinth:cloth-config:Nv3xnWXd' // 26.2.155, required by MoreCulling
        localRuntime 'maven.modrinth:lithium:f7vZ0VWU' // 0.25.3
        localRuntime 'maven.modrinth:distanthorizons:aAow4a9f' // 3.3.3
    }
}

test {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
    doFirst { workingDir.mkdirs() }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    def archiveName = project.base.archivesName.get()
    inputs.property 'archiveName', archiveName

    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}
