plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        perde {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            runDir = 'run'
        }
    }
}

repositories {
    maven {
        name = 'MCEFModern'
        url = 'https://maven.dimaskama.net/releases'
        content {
            includeGroup 'net.dimaskama'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    clientImplementation "net.dimaskama:mcef-modern:${project.mcef_version}"
    // MCEF publishes JCEF as a runtime dependency; the spike also calls its FPS API.
    clientCompileOnly "me.friwi:jcef-api:${project.jcef_api_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    def archiveName = project.base.archivesName.get()
    inputs.property 'archiveName', archiveName

    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}
