<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perde F1B-2 deterministic media fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #102136; color: #fff; font: 26px/1.3 Arial, sans-serif; }
    header { height: 72px; padding: 18px 24px; display: flex; justify-content: space-between; background: #0b5265; }
    header span:last-child { color: #ffd966; }
    main { height: calc(100% - 180px); display: flex; justify-content: center; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    footer { height: 108px; padding: 12px 24px; font-size: 24px; }
    #status { white-space: nowrap; color: #b5f5c5; font-variant-numeric: tabular-nums; }
    #live { color: #ffd966; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header><strong>TOP LEFT | PERDE F1B-2</strong><span>TOP RIGHT | 16:9</span></header>
  <main><video src="sample.webm" controls preload="auto"></video></main>
  <footer>
    <div id="status">Waiting for local media metadata...</div>
    <div id="live">Live page heartbeat: 0</div>
  </footer>
  <script>
    const video = document.querySelector('video');
    const status = document.getElementById('status');
    const live = document.getElementById('live');
    let heartbeat = 0;
    setInterval(() => {
      const duration = Number.isFinite(video.duration) ? video.duration.toFixed(2) : 'pending';
      status.textContent = `time=${video.currentTime.toFixed(2)} / ${duration}s | paused=${video.paused} | muted=${video.muted} | volume=${video.volume.toFixed(2)}`;
      const seekable = Array.from({ length: video.seekable.length }, (_, i) => `${video.seekable.start(i).toFixed(2)}..${video.seekable.end(i).toFixed(2)}`).join(', ') || 'none';
      live.textContent = `Live page heartbeat: ${++heartbeat} | readyState=${video.readyState} | seekable=${seekable}`;
    }, 100);
  </script>
</body>
</html>
